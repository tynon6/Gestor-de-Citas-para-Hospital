<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanitasFlow - Área de pacientes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="registro">
    <main class="center-shell">
        <section class="card">
            <h1 class="card-title">✚ SanitasFlow</h1>
            <p class="tagline">Área de pacientes</p>

            <div class="tabs" role="tablist" aria-label="Acceso de pacientes">
                <button class="tab-button active" type="button" data-auth-tab="login">Iniciar sesión</button>
                <button class="tab-button" type="button" data-auth-tab="register">Registrarme</button>
            </div>

            <div id="auth-message" class="message" role="status"></div>

            <form id="login-form">
                <div class="field">
                    <label for="login-correo">Correo electrónico</label>
                    <input type="email" id="login-correo" autocomplete="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="field">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" autocomplete="current-password" placeholder="Contraseña" required>
                </div>

                <button class="btn btn-primary btn-full" type="submit">Iniciar sesión</button>
            </form>

            <form id="register-form" class="hidden">
                <div class="form-grid-3">
                    <div class="field">
                        <label for="reg-nombres">Nombre(s)</label>
                        <input type="text" id="reg-nombres" autocomplete="given-name" required>
                    </div>

                    <div class="field">
                        <label for="reg-paterno">Apellido paterno</label>
                        <input type="text" id="reg-paterno" autocomplete="family-name" required>
                    </div>

                    <div class="field">
                        <label for="reg-materno">Apellido materno</label>
                        <input type="text" id="reg-materno" autocomplete="family-name">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label for="reg-edad">Edad</label>
                        <input type="number" id="reg-edad" min="0" max="120" required>
                    </div>

                    <div class="field">
                        <label for="reg-correo">Correo electrónico</label>
                        <input type="email" id="reg-correo" autocomplete="email" placeholder="correo@ejemplo.com" required>
                    </div>
                </div>

                <div class="field">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" autocomplete="new-password" placeholder="Crea una contraseña" required>
                </div>

                <button class="btn btn-primary btn-full" type="submit">Crear cuenta</button>
            </form>

            <div class="actions" style="margin-top:20px;">
                <a href="index.html" class="btn btn-secondary btn-full">Regresar al inicio</a>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
